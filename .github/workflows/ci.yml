name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (no GPU, no voice engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      # the web extra only: the tests never reach torch, Chatterbox or Demucs (tests/conftest.py)
      - run: uv sync --frozen --extra web
      - run: uv run --frozen pytest -q

  lint:
    name: ruff, and mypy not growing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra web
      - run: uv run --frozen ruff check src tests docs/bench tools
      - name: mypy, against mypy-baseline.txt
        run: uv run --frozen python tools/mypy_baseline.py

  macos-edge:
    name: macOS, stock voice without separation (the Mac's v2 requirement)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: ffmpeg
        run: brew install ffmpeg
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      # no extras: neither separate (torch, demucs) nor clone (Chatterbox) may be needed on this path
      - run: uv sync --frozen
      - name: A whole dub with the stock voice, no torch imported
        run: uv run --frozen python tests/e2e_flow.py "$RUNNER_TEMP/e2e"

  frontend:
    name: Frontend (types, build in sync with src/opendub/web/static)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # the build is committed so that using the web page needs no Node: it must match the sources
      - name: Committed build matches the sources
        run: |
          git add -N ../src/opendub/web/static
          if ! git diff --exit-code --stat -- ../src/opendub/web/static; then
            echo "::error::src/opendub/web/static is out of date: run 'npm run build' in frontend/ and commit it"
            exit 1
          fi
