# The venv OpenTranslator's CosyVoice worker runs in (`opentranslator setup-engine cosyvoice`).
#
# CosyVoice is not a pip package: its code is a pinned commit of its repo
# (src/opentranslator/cosyvoice.py: REPO_REV), put on sys.path by the worker, and
# these are the dependencies its inference needs. Its requirements.txt pins
# torch 2.3.1 (CUDA 12.1, no RTX 50-series kernels) and carries training and
# serving packages; the versions below were checked on an RTX 5080 (sm_120)
# with the benchmark in docs/bench (docs/v2-plan.md, 2026-10-25).
[project]
name = "opentranslator-cosyvoice-env"
version = "0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 2026-10-25: 2.8.0+cu128, the first CUDA 12.8 build checked on sm_120 (its repo pins 2.3.1)
    "torch==2.8.0",
    "torchaudio==2.8.0",
    # 2026-10-25: as in its requirements.txt
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "modelscope==1.20.0",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "pyworld==0.3.4",
    "soundfile==0.12.1",
    "transformers==4.51.3",
    "x-transformers==2.11.24",
    "wetext==0.0.4",
    "wget==3.2",
    "gdown==5.1.0",
    "numpy==1.26.4",
    "matplotlib",
    "rich",
    "huggingface_hub",
    # 2026-10-25: its 1.18.0 has no wheel for this Python; 1.22.0 runs its ONNX speaker
    # encoder and speech tokenizer with CUDA 12
    "onnxruntime-gpu==1.22.0",
    # 2026-10-25: its 20231117 no longer builds (setup.py imports pkg_resources); same API
    "openai-whisper==20250625",
    # 2026-10-25: pkg_resources, which lightning 2.2 still imports, is gone from setuptools 81
    "setuptools<81",
]
# Left out from its requirements.txt: deepspeed, tensorrt (training and its TensorRT
# path), gradio, fastapi, uvicorn, grpcio (its demos and servers), tensorboard.

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
