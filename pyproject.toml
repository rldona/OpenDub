[project]
name = "opentranslator"
version = "0.1.0"
description = "Dub YouTube videos into Spanish with a synthetic voice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "yt-dlp[default]>=2026.10.21",
]

[project.optional-dependencies]
# Voice/music separation: MLX on Apple Silicon, PyTorch (CUDA 12.8 wheels) on Linux
separate = [
    "demucs-mlx>=1.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "demucs>=4.1.0; sys_platform == 'linux'",
    "torch>=2.7; sys_platform == 'linux'",
]

[project.scripts]
opentranslator = "opentranslator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# CUDA 12.8 builds of PyTorch: required by RTX 50-series (Blackwell) GPUs
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# Supported platforms: Apple Silicon Macs and Linux (with or without an NVIDIA GPU)
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]
