[project]
name = "opendub"
version = "0.1.0"
description = "Dub YouTube videos into Spanish with a synthetic voice"
readme = "README.md"
license = "MIT"  # OpenDub's own code; the engines keep their licenses (README, Licenses)
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "num2words>=0.5.13",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "yt-dlp[default]>=2026.10.21",
]

[project.optional-dependencies]
# Voice/music separation: MLX on Apple Silicon, PyTorch (CUDA 12.8 wheels) on Linux
separate = [
    "demucs-mlx>=1.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "demucs>=4.1.0; sys_platform == 'linux'",
    "torch>=2.7; sys_platform == 'linux'",
]
# Local web frontend: `opendub web`
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# Voice cloning with Chatterbox Multilingual V3 (not on PyPI yet: pinned GitHub commit)
clone = [
    "chatterbox-tts",
    "torch>=2.7",
    "torchaudio>=2.7",
]

[project.scripts]
opendub = "opendub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy==2.4.0",
    "pytest>=9.1.1",
    "ruff==0.17.2",
]

# CUDA 12.8 builds of PyTorch: required by RTX 50-series (Blackwell) GPUs
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
chatterbox-tts = { git = "https://github.com/resemble-ai/chatterbox", rev = "5de7a54aa4e5e2baadb0182dde554908b48b85c2" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# chatterbox-tts pins torch 2.6 (no RTX 50-series support), numpy 1.x and gradio
# (only used by its demos): lift the pins and drop gradio
override-dependencies = [
    "torch>=2.7",
    "torchaudio>=2.7",
    "numpy>=2.4.6",
    "gradio; sys_platform == 'never'",
]
# Supported platforms: Apple Silicon Macs and Linux (with or without an NVIDIA GPU)
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# real mistakes and import order; a wider set can be added rule by rule, each with its fixes
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines are left to judgement: the long ones are messages and ffmpeg graphs
    "B904",  # SystemExit with a message inside except: the user gets the message, not the chain
    "B905",  # zip(strict=) is added where lengths can differ, not everywhere
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
files = ["src/opendub"]
ignore_missing_imports = true  # torch, demucs, chatterbox and the like ship no types
# the errors there were when mypy was added are listed in mypy-baseline.txt: CI fails on any new one
# (tools/mypy_baseline.py), and the list only shrinks
