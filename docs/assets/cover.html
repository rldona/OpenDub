<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; position: relative;
    background:
      radial-gradient(900px 600px at 105% 105%, rgba(139, 124, 246, .55), transparent 62%),
      radial-gradient(700px 500px at -10% -20%, rgba(139, 124, 246, .22), transparent 60%),
      linear-gradient(135deg, #0d0c18 0%, #1b1838 60%, #13112a 100%);
  }
  .brand { position: absolute; left: 76px; top: 92px; width: 540px; }
  .icon { width: 132px; height: 132px; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .45)); }
  h1 { font-size: 92px; line-height: 1; letter-spacing: -2.5px; margin-top: 34px; font-weight: 800; }
  .tag { font-size: 32px; line-height: 1.3; margin-top: 22px; color: #ddd8ff; font-weight: 500; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 34px; white-space: nowrap; }
  .chip { font-size: 17px; padding: 6px 13px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07); color: #eeebff; }
  .shot {
    position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 0 1.5px rgba(255, 255, 255, .14);
    background: #16151f;
  }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1f1e2a; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="brand">
    <svg class="icon" viewBox="0 0 1024 1024" role="img" aria-label="OpenDub icon">
      <rect width="1024" height="1024" rx="224" fill="#8b7cf6"/>
      <g stroke="#fff" stroke-width="82" stroke-linecap="round">
        <path d="M272 452v120M392 352v320M512 412v200M632 292v440M752 452v120"/>
      </g>
    </svg>
    <h1>OpenDub</h1>
    <p class="tag">YouTube, dubbed into Spanish.<br>In a voice like the original.</p>
    <div class="chips">
      <span class="chip">Open source</span><span class="chip">Runs locally</span><span class="chip">Voice cloning</span><span class="chip">Keeps the music</span>
    </div>
  </div>
  <div class="shot">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <img src="app.png" alt="OpenDub">
  </div>
</body>
</html>
